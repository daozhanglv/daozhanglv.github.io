<article class="post-row"><div class="post-date"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time><span>{{ .ReadingTime }} 分钟阅读</span></div><div><div class="tags">{{ range .GetTerms "tags" }}<a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}{{ if .Params.example }}<span>示例文章</span>{{ end }}</div><h3><a href="{{ .RelPermalink }}">{{ .Title }} <span>↗</span></a></h3><p>{{ .Description | default (.Summary | plainify | truncate 110) }}</p></div></article>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 216" role="img" aria-labelledby="ma-title ma-desc">
  <title id="ma-title">mac-autosync Nightly Backup Pipeline</title>
  <desc id="ma-desc">Nightly pipeline triggered by macOS launchd running Bash 3.2 scripts to collect dotfiles and Brewfile, block secrets via path denylist and gitleaks staged scan, and push to a private Git repository.</desc>
  <style>
    .bg { fill: #ebe9e1; stroke: #c7c6bc; stroke-width: 1; }
    .box { fill: #f5f4ee; stroke: #171814; stroke-width: 1; }
    .box-accent { fill: #f5f4ee; stroke: #276482; stroke-width: 1.5; }
    .bar { fill: #e3e1d8; stroke: #c7c6bc; stroke-width: 1; }
    .eyebrow { font: 600 9.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #276482; letter-spacing: 0.9px; }
    .title { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171814; }
    .meta { font: 400 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #595a54; }
    .arrow { stroke: #171814; stroke-width: 1.2; fill: none; }
    .arrow-head { fill: #171814; }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="719" height="215"/>

  <!-- Stage 1: Scheduler -->
  <rect class="box" x="18" y="20" width="146" height="106"/>
  <text class="eyebrow" x="30" y="40">01 · SCHEDULER</text>
  <text class="title" x="30" y="61">macOS launchd</text>
  <text class="meta" x="30" y="82">05:23 nightly run</text>
  <text class="meta" x="30" y="99">No background daemon</text>
  <text class="meta" x="30" y="115">Explicit brew PATH</text>

  <line class="arrow" x1="164" y1="73" x2="186" y2="73"/>
  <polygon class="arrow-head" points="191,73 184,69.5 184,76.5"/>

  <!-- Stage 2: Snapshot -->
  <rect class="box" x="193" y="20" width="146" height="106"/>
  <text class="eyebrow" x="205" y="40">02 · SNAPSHOT</text>
  <text class="title" x="205" y="61">Bash 3.2 Sync</text>
  <text class="meta" x="205" y="82">Copy files.txt list</text>
  <text class="meta" x="205" y="99">Dump Brewfile</text>
  <text class="meta" x="205" y="115">One-way host → repo</text>

  <line class="arrow" x1="339" y1="73" x2="361" y2="73"/>
  <polygon class="arrow-head" points="366,73 359,69.5 359,76.5"/>

  <!-- Stage 3: Secret Guard -->
  <rect class="box-accent" x="368" y="20" width="160" height="106"/>
  <text class="eyebrow" x="380" y="40">03 · SECRET GUARD</text>
  <text class="title" x="380" y="61">Two-Layer Block</text>
  <text class="meta" x="380" y="82">1. Sensitive denylist</text>
  <text class="meta" x="380" y="99">2. gitleaks staged</text>
  <text class="meta" x="380" y="115">Pre-commit gate</text>

  <line class="arrow" x1="528" y1="73" x2="550" y2="73"/>
  <polygon class="arrow-head" points="555,73 548,69.5 548,76.5"/>

  <!-- Stage 4: Remote -->
  <rect class="box" x="557" y="20" width="145" height="106"/>
  <text class="eyebrow" x="569" y="40">04 · REMOTE GIT</text>
  <text class="title" x="569" y="61">Private Repo</text>
  <text class="meta" x="569" y="82">Unsigned commit</text>
  <text class="meta" x="569" y="99">3x push retry</text>
  <text class="meta" x="569" y="115">Next-night fallback</text>

  <!-- Cross-cutting bars -->
  <rect class="bar" x="18" y="142" width="332" height="56"/>
  <text class="eyebrow" x="30" y="161">FAIL-SAFE LEAK POLICY</text>
  <text class="meta" x="30" y="181">Cancel commit before history + macOS notification</text>

  <rect class="bar" x="366" y="142" width="336" height="56"/>
  <text class="eyebrow" x="378" y="161">DRY RUN &amp; RESTORE</text>
  <text class="meta" x="378" y="181">install.sh --check · install.sh --restore (.bak)</text>
</svg>
